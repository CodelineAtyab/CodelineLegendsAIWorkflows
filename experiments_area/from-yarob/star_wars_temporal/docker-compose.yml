# Local Temporal stack: Postgres (storage) + Temporal server + Temporal Web UI.
# Start:  docker compose up -d      Stop: docker compose down
# "down" keeps the named volume, so workflow history survives restarts.
# ("down -v" would delete the volume and wipe all history.)

services:
  postgres:
    # Temporal stores every workflow's event history here. That stored history
    # is what lets a workflow resume after a crash instead of starting over.
    image: postgres:16
    environment:
      # Values come from .env (git-ignored). The ":?" syntax makes compose stop
      # with a clear error if the variable is missing, instead of starting
      # Postgres with an empty password.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume (not a container folder) so data outlives the container.
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports "accepting connections" only once Postgres is really
      # ready. Temporal waits for this, so startup works the first time.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    # The "auto-setup" image creates Temporal's database schema in Postgres
    # on first start, and registers the "default" namespace.
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy   # wait for Postgres health check, not just "container started"
    environment:
      DB: postgres12                 # Temporal's SQL plugin name for Postgres 12+
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres       # hostname of the postgres service on the compose network
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
    ports:
      - "7233:7233"                  # gRPC port that worker.py and starter.py connect to
    healthcheck:
      # Healthy only when the frontend answers. The UI waits for this.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    # Web UI to watch workflows, retries and history: http://localhost:8080
    image: temporalio/ui:2.37.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  temporal-postgres-data:
