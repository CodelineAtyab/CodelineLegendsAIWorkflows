server {
    listen 80;

    location = / {
        proxy_pass http://n8n:5678/webhook/home;
    }

    location = /health {
        proxy_pass http://n8n:5678/webhook/health;
    }

    location = /visits {
        proxy_pass http://n8n:5678/webhook/visits;
    }

    location / {
        return 404;
    }
}
