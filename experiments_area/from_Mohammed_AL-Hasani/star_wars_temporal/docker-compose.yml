# Local Temporal stack: Postgres (Temporal's database) + Temporal server + Web UI.
# Start with `docker compose up -d`, stop with `docker compose down`.
# Credentials are read from the git-ignored .env file (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      # Named volume: workflow history survives `docker compose down` and restarts.
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Temporal must not start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    # auto-setup creates the Temporal databases and the "default" namespace on first start.
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      # Healthy only once the frontend answers, so the UI and workers do not race it.
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  temporal_postgres_data:
