services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      TZ: Asia/Muscat
      GENERIC_TIMEZONE: Asia/Muscat
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: miniapp
      DB_POSTGRESDB_USER: trainuser
      DB_POSTGRESDB_PASSWORD: trainpass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: miniapp
      POSTGRES_USER: trainuser
      POSTGRES_PASSWORD: trainpass
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainuser -d miniapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  n8n_data:
  db_data: