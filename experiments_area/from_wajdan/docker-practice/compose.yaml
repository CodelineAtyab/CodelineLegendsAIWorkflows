services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://trainuser:trainpass@db:5432/traindb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: traindb
      POSTGRES_USER: trainuser
      POSTGRES_PASSWORD: trainpass
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainuser -d traindb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: