[project]
name = "chat-sessions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hidaya21", email = "alabrihidaya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
chat-sessions = "chat_sessions:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
